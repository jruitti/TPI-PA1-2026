server.port=8080

# Base de datos en memoria para ejecucion local
spring.datasource.url=jdbc:h2:mem:recursos_humanos;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Inclusion de mensajes descriptivos en respuestas de error
server.error.include-message=always
